<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - Budget Buddy</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="signup-page">

        <!-- Login -->
        <div class="signup-login">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Log in
            </a>

        </div>


        <!-- Signup Card -->
        <div class="signup-card">

            <h1>Create your account</h1>

            <p class="signup-subtitle">
                Start tracking where every rupee goes.
            </p>

            {% if error %}
            <p style="color: #ff5c5c; margin-bottom: 20px;">
                {{ error }}
            </p>
            {% endif %}

            {% if success %}
                <p style="color: #b5ff3c; margin-bottom: 20px;">
                    {{ success }}
                </p>
            {% endif %}


            <form class="signup-form" method="POST" action="/signup">

                <!-- Display Name -->
                <label for="displayName">
                    Display Name
                </label>

                <input
                    type="text"
                    id="displayName"
                    name="displayName"
                    placeholder="Ram"
                    required
                >


                <!-- Email -->
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    required
                >


                <!-- Button -->
                <button
                    type="submit"
                    class="signup-btn">
                    Create account
                </button>

            </form>

        </div>


        <!-- Login -->
        <div class="signup-login">

            Already have an account?

            <a href="#">
                Log in
            </a>

        </div>

    </div>

</body>

</html>
